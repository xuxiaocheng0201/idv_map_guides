plugins:
  build_runner_hook: ^2.0.2

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

include: package:flutter_lints/flutter.yaml

linter:
  rules:
   prefer_single_quotes: true
