name: idv_map_guides
description: "IdentityV CrypticNotes maps guide."
publish_to: 'none'

version: 2.1.0+20260917

environment:
  sdk: ^3.13.3
  flutter: ^3.47.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  package_info_plus: ^10.2.1
  sentry_flutter: ^9.30.1
  freezed_annotation: ^3.1.0
  toastification: ^3.2.0
  file_picker: ^13.1.0
  path: ^1.9.1
  messagepack: ^0.2.1
  comparators: ^1.2.0
  cachemesh: ^2.0.0
  collection: ^1.19.1
  squadron: ^7.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.16
  sentry_dart_plugin: ^3.4.0
  build_runner: ^2.16.0
  freezed: ^4.0.0
  squadron_builder: ^9.3.2
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/maps/the_bringer_of_doom/novice/
    - assets/maps/the_bringer_of_doom/hard/
    - assets/maps/the_bringer_of_doom/insane/

flutter_intl:
  enabled: true

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
