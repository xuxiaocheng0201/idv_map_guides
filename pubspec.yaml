name: idv_map_guides
description: "IdentityV CrypticNotes map guide."
publish_to: 'none'

version: 4.0.0

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  sentry_flutter: ^10.3.0
  freezed_annotation: ^3.1.0
  toastification: ^3.2.2
  file_picker: ^13.3.3
  path: ^1.9.1
  messagepack: ^0.2.1
  comparators: ^1.3.0
  cachemesh: ^2.1.0
  collection: ^1.19.1
  squadron: ^7.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sentry_dart_plugin: ^3.4.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  squadron_builder: ^9.3.2
  crypto: ^3.0.8
  sw: ^0.5.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/maps/the_bringer_of_doom/novice/
    - assets/maps/the_bringer_of_doom/easy/
    - assets/maps/the_bringer_of_doom/hard/
    - assets/maps/the_bringer_of_doom/nightmare/
    - assets/maps/phosphorescence_disease/nightmare/

sentry:
  upload_debug_symbols: true
  upload_sources: true
  upload_source_maps: true
  wait_for_processing: true
