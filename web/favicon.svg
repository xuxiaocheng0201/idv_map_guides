<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <defs>
        <radialGradient id="sapphireGrad" cx="45%" cy="35%" r="55%">
            <stop offset="0%" stop-color="#7ec8e3"/>
            <stop offset="25%" stop-color="#4a90d9"/>
            <stop offset="55%" stop-color="#2a4a7f"/>
            <stop offset="85%" stop-color="#1a2a5a"/>
            <stop offset="100%" stop-color="#0d1a3a"/>
        </radialGradient>
        <radialGradient id="sapphireHighlight" cx="30%" cy="25%" r="30%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
        <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e8c86a"/>
            <stop offset="30%" stop-color="#c9a84c"/>
            <stop offset="60%" stop-color="#8a7a3a"/>
            <stop offset="100%" stop-color="#4a3a1a"/>
        </linearGradient>
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1a1a2e"/>
            <stop offset="100%" stop-color="#0a0a12"/>
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="softGlow">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="500" height="500" rx="20" fill="url(#bgGlow)"/>

    <circle cx="250" cy="250" r="210" fill="none" stroke="#3a2a1a" stroke-width="12"/>
    <circle cx="250" cy="250" r="200" fill="none" stroke="url(#metalRing)" stroke-width="8"/>

    <g stroke="#e8c86a" stroke-width="2.5">
        <line x1="250" y1="60" x2="250" y2="90"/>
        <line x1="250" y1="410" x2="250" y2="440"/>
        <line x1="410" y1="250" x2="440" y2="250"/>
        <line x1="60" y1="250" x2="90" y2="250"/>
    </g>

    <g stroke="#c9a84c" stroke-width="1.5">
        <line x1="250" y1="60" x2="250" y2="90" transform="rotate(45,250,250)"/>
        <line x1="250" y1="60" x2="250" y2="90" transform="rotate(135,250,250)"/>
        <line x1="250" y1="60" x2="250" y2="90" transform="rotate(225,250,250)"/>
        <line x1="250" y1="60" x2="250" y2="90" transform="rotate(315,250,250)"/>
    </g>

    <g stroke="#8a7a3a" stroke-width="1">
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(15,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(30,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(60,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(75,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(105,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(120,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(150,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(165,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(195,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(210,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(240,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(255,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(285,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(300,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(330,250,250)"/>
        <line x1="250" y1="55" x2="250" y2="70" transform="rotate(345,250,250)"/>
    </g>

    <g font-family="'Times New Roman', serif" font-size="22" fill="#e8c86a" text-anchor="middle" font-weight="bold">
        <text x="250" y="48">N</text>
        <text x="250" y="470">S</text>
        <text x="460" y="258">E</text>
        <text x="40" y="258">W</text>
    </g>

    <circle cx="250" cy="250" r="155" fill="none" stroke="#8a7a3a" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="145" fill="none" stroke="#4a3a2a" stroke-width="1"/>

    <g stroke="#5a4a2a" stroke-width="0.8" fill="none">
        <path d="M160,250 Q205,180 250,250 Q295,320 340,250" opacity="0.5"/>
        <path d="M160,250 Q205,320 250,250 Q295,180 340,250" opacity="0.5"/>
        <circle cx="205" cy="215" r="3" opacity="0.4"/>
        <circle cx="295" cy="285" r="3" opacity="0.4"/>
    </g>

    <g filter="url(#glow)">
        <polygon points="250,115 242,250 250,250 258,250 250,115" fill="#e8c86a" opacity="0.7"/>
        <polygon points="250,115 235,240 250,250 265,240 250,115" fill="none" stroke="#e8c86a" stroke-width="1" opacity="0.5"/>
        <circle cx="250" cy="250" r="8" fill="#e8c86a" opacity="0.8"/>
        <circle cx="250" cy="250" r="4" fill="#1a1a2e"/>
    </g>

    <g filter="url(#glow)">
        <path d="M195,185 L235,155 L265,155 L305,185 L305,315 L250,365 L195,315 Z"
