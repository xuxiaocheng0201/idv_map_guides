        <path d="M208,198 L240,172 L260,172 L292,198 L292,302 L250,345 L208,302 Z"
              fill="url(#sapphireGrad)"/>

        <path d="M230,250 L250,200 L270,250 L250,320 Z" fill="rgba(255,255,255,0.04)"/>
        <path d="M208,250 L230,250 L250,320 L220,290 Z" fill="rgba(0,0,0,0.08)"/>
        <path d="M292,250 L270,250 L250,320 L280,290 Z" fill="rgba(0,0,0,0.06)"/>

        <ellipse cx="235" cy="215" rx="25" ry="35" fill="url(#sapphireHighlight)" transform="rotate(-15,235,215)"/>

        <path d="M220,300 L250,345 L280,300 L250,285 Z" fill="rgba(0,0,20,0.4)"/>

        <g font-family="'Courier New', monospace" font-size="9" fill="rgba(200,180,150,0.25)"
           text-anchor="middle" letter-spacing="1">
            <text x="250" y="220">I START IN</text>
            <text x="250" y="233">THE DEEP</text>
            <text x="250" y="260">I HIDE IN</text>
            <text x="250" y="273">THE BLOOM</text>
            <text x="250" y="300">WHO AM I</text>
        </g>

        <circle cx="250" cy="110" r="10" fill="none" stroke="url(#metalRing)" stroke-width="3"/>
        <circle cx="250" cy="110" r="6" fill="none" stroke="#4a3a2a" stroke-width="1"/>

        <rect x="244" y="118" width="12" height="25" rx="2" fill="url(#metalRing)" stroke="#3a2a1a" stroke-width="1"/>

        <path d="M235,145 Q215,130 222,115" stroke="url(#metalRing)" stroke-width="3" fill="none"/>
        <path d="M265,145 Q285,130 278,115" stroke="url(#metalRing)" stroke-width="3" fill="none"/>

        <circle cx="227" cy="125" r="2.5" fill="#e8c86a"/>
        <circle cx="273" cy="125" r="2.5" fill="#e8c86a"/>

        <path d="M230,155 L270,155 L268,163 L232,163 Z" fill="url(#metalRing)" stroke="#3a2a1a" stroke-width="1"/>
        <circle cx="238" cy="159" r="1.5" fill="#e8c86a"/>
        <circle cx="262" cy="159" r="1.5" fill="#e8c86a"/>
        <circle cx="250" cy="159" r="1.5" fill="#e8c86a"/>
    </g>

    <path d="M200,220 Q225,180 250,220 Q275,260 300,220 L300,320 L250,380 L200,320 Z"
          fill="rgba(74,144,217,0.08)" filter="url(#softGlow)"/>

    <g stroke="#4a3a2a" stroke-width="1" fill="none" opacity="0.5">
        <path d="M30,30 L70,30 L70,40 L40,40 L40,70 L30,70 Z"/>
        <path d="M35,35 L65,35 L65,38 L38,38 L38,65 L35,65 Z" fill="#3a2a1a"/>
        <path d="M470,30 L430,30 L430,40 L460,40 L460,70 L470,70 Z"/>
        <path d="M465,35 L435,35 L435,38 L462,38 L462,65 L465,65 Z" fill="#3a2a1a"/>
        <path d="M30,470 L70,470 L70,460 L40,460 L40,430 L30,430 Z"/>
        <path d="M35,465 L65,465 L65,462 L38,462 L38,435 L35,435 Z" fill="#3a2a1a"/>
        <path d="M470,470 L430,470 L430,460 L460,460 L460,430 L470,430 Z"/>
        <path d="M465,465 L435,465 L435,462 L462,462 L462,435 L465,435 Z" fill="#3a2a1a"/>
    </g>

    <path d="M200,55 Q250,40 300,55" stroke="#8a7a3a" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M210,62 Q250,50 290,62" stroke="#5a4a2a" stroke-width="1" fill="none" opacity="0.4"/>
</svg>